apis:
- name: GP Connect Access Document - FHIR API
  description: >
    Retrieve documents held at a patient's registered GP practice, such as letters, discharge summaries,
    and other clinical documents stored in GP systems. Used alongside the Access Record Structured API.
  image: https://digital.nhs.uk/svg/nhs-logo.svg
  humanURL: https://digital.nhs.uk/developer/api-catalogue/gp-connect-access-document-fhir
  baseURL: https://api.service.nhs.uk/gp-connect
  tags:
  - GP Connect
  - FHIR
  - Documents
  properties:
  - type: Documentation
    url: https://digital.nhs.uk/developer/api-catalogue/gp-connect-access-document-fhir
  contact:
  - FN: NHS England Developer Support
    email: api.management@nhs.net
  meta:
  - key: authentication
    value: CIS2 OAuth2 via Spine Secure Proxy (SSP)
- name: EPS Prescription Tracker - FHIR API
  description: >
    Real-time tracking of prescriptions within the Electronic Prescription Service. Enables authorised
    users to retrieve details about prescription status and dispensation progress without writing to EPS.
  image: https://digital.nhs.uk/svg/nhs-logo.svg
  humanURL: https://digital.nhs.uk/developer/api-catalogue/eps-prescription-tracker-fhir-api
  baseURL: https://api.service.nhs.uk/eps-tracker
  tags:
  - Electronic Prescriptions
  - FHIR
  - Prescription Tracking
  - EPS
  properties:
  - type: Documentation
    url: https://digital.nhs.uk/developer/api-catalogue/eps-prescription-tracker-fhir-api
  contact:
  - FN: NHS England Developer Support
    email: api.management@nhs.net
- name: Booking and Referral - FHIR API
  description: >
    Send booking and referral information between NHS service providers using the NHS Booking and Referral
    Standard (BaRS). Enables sharing of clinical and administrative data to support transfer of care.
  image: https://digital.nhs.uk/svg/nhs-logo.svg
  humanURL: https://digital.nhs.uk/developer/api-catalogue/booking-and-referral-fhir
  baseURL: https://api.service.nhs.uk/booking-and-referral
  tags:
  - Booking
  - Referral
  - FHIR R4
  - Transfer of Care
  - BaRS
  properties:
  - type: Documentation
    url: https://digital.nhs.uk/developer/api-catalogue/booking-and-referral-fhir
  contact:
  - FN: NHS England Developer Support
    email: api.management@nhs.net
  meta:
  - key: fhir-version
    value: R4
- name: NHS Website Content API
  description: >
    Retrieve NHS-approved health information content (conditions, medicines, treatments, live well articles)
    for syndication into third-party apps and services. Returns structured content with HTML and metadata.
    Rate limited to 4,000 requests per hour by default.
  image: https://digital.nhs.uk/svg/nhs-logo.svg
  humanURL: https://digital.nhs.uk/developer/api-catalogue/nhs-website-content
  baseURL: https://api.service.nhs.uk/nhs-website-content
  tags:
  - Content
  - Syndication
  - Health Information
  - REST
  properties:
  - type: Documentation
    url: https://digital.nhs.uk/developer/api-catalogue/nhs-website-content
  - type: TermsOfService
    url: https://onboarding.prod.api.platform.nhs.uk/PolicyPages/TermsOfUsePolicy
  contact:
  - FN: NHS England Developer Support
    email: api.management@nhs.net
  meta:
  - key: rate-limit
    value: 4000 requests per hour (default); higher limits by written agreement
- name: Elective Waiting List API
  description: >
    Access data from the NHS Waiting List Minimum Data Set (WLMDS), the national electronic database of
    NHS patient waiting list records. Supports performance monitoring and patient pathway management for
    elective care.
  image: https://digital.nhs.uk/svg/nhs-logo.svg
  humanURL: https://digital.nhs.uk/developer/api-catalogue/elective-waiting-list
  baseURL: https://api.service.nhs.uk/elective-waiting-list
